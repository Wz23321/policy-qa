services:
  policy-qa:
    build: .
    image: policy-qa:latest
    container_name: policy-qa
    ports:
      - "8100:8100"
    environment:
      # 从宿主机环境变量或同目录的 .env 读取，不要把 key 写进镜像
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请先设置 DEEPSEEK_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3